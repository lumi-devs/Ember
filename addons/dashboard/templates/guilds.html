{% extends "base.html" %}
{% block title %}Your Servers — Ember Dashboard{% endblock %}
{% block body %}
<div class="app-root">
  <header class="topbar">
    <div class="topbar-brand">
      <svg width="28" height="28" viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="24" r="24" fill="#5865F2"/>
        <path d="M32 16C32 16 28.5 15 24 15C19.5 15 16 16 16 16C16 16 13 24 13 28C13 28 16 30 24 30C32 30 35 28 35 28C35 24 32 16 32 16Z" fill="white"/>
        <circle cx="20" cy="24" r="2" fill="#5865F2"/>
        <circle cx="28" cy="24" r="2" fill="#5865F2"/>
      </svg>
      <span>Ember</span>
    </div>
    <div class="topbar-user" id="topbar-user">
      <img id="user-avatar" src="{{ user.avatar }}" alt="" width="32" height="32" />
      <span id="user-name">{{ user.username }}</span>
      <a href="/logout" class="btn btn-ghost btn-sm">Sign out</a>
    </div>
  </header>

  <main class="guilds-main">
    <h2 class="guilds-heading">Your Servers</h2>
    <p class="guilds-sub">Select a server to manage its Ember settings.</p>
    <div class="guilds-grid" id="guilds-grid">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
  </main>
</div>
{% endblock %}
{% block scripts %}
<script>
  async function loadGuilds() {
    const grid = document.getElementById('guilds-grid');
    const resp = await fetch('/api/guilds');
    if (!resp.ok) { grid.innerHTML = '<p class="error-msg">Failed to load servers.</p>'; return; }
    const guilds = await resp.json();
    if (!guilds.length) {
      grid.innerHTML = '<p class="empty-msg">No shared servers found. Make sure Ember is in your server.</p>';
      return;
    }
    grid.innerHTML = guilds.map(g => `
      <a class="guild-card" href="/guilds/${g.id}">
        ${g.icon
          ? `<img class="guild-icon" src="${g.icon}" alt="" />`
          : `<div class="guild-icon guild-icon-placeholder">${g.name.charAt(0)}</div>`}
        <div class="guild-info">
          <div class="guild-name">${escHtml(g.name)}</div>
          ${g.member_count ? `<div class="guild-members">${g.member_count.toLocaleString()} members</div>` : ''}
        </div>
        <svg class="guild-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </a>
    `).join('');
  }
  function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  loadGuilds();
</script>
{% endblock %}
